[Unit]
Requisite=graphical-session.target
ConditionEnvironment=WAYLAND_DISPLAY
ConditionEnvironment=HYPRLAND_INSTANCE_SIGNATURE

[Service]
ExecStartPre=/usr/bin/python3 %h/.local/libexec/hypr-rdp/workspaces.py prepare
# The ':' leaves $HOME for the native hook's /bin/sh, inside double quotes.
ExecStart=
ExecStart=:/usr/bin/hypr-rdp \
    --on-session-start 'exec /usr/bin/python3 "$HOME/.local/libexec/hypr-rdp/workspaces.py" connect' \
    --on-session-end 'exec /usr/bin/python3 "$HOME/.local/libexec/hypr-rdp/workspaces.py" disconnect'
ExecStartPost=/usr/bin/python3 %h/.local/libexec/hypr-rdp/workspaces.py ready
ExecStop=/usr/bin/python3 %h/.local/libexec/hypr-rdp/workspaces.py before-stop
# Let the server finish its disconnect hook before systemd cleans up children.
KillMode=mixed
ExecStopPost=/usr/bin/python3 %h/.local/libexec/hypr-rdp/workspaces.py stop
