# Explicit package names. An absent provider mapping means unsupported.
# Use default only when the package name really is shared by all four adapters.
[packages.git]
default = ["git"]
[packages.zsh]
default = ["zsh"]
[packages.zsh-autosuggestions]
default = ["zsh-autosuggestions"]
[packages.zsh-syntax-highlighting]
default = ["zsh-syntax-highlighting"]
[packages.tmux]
default = ["tmux"]
[packages.less]
default = ["less"]
[packages.vim]
default = ["vim"]
[packages.neovim]
default = ["neovim"]
[packages.ripgrep]
default = ["ripgrep"]
[packages.fd]
apt = ["fd-find"]
dnf = ["fd-find"]
pacman = ["fd"]
brew = ["fd"]
[packages.zoxide]
default = ["zoxide"]
[packages.htop]
default = ["htop"]
[packages.rsync]
default = ["rsync"]
[packages.wget]
default = ["wget"]
[packages.unzip]
default = ["unzip"]
[packages.zip]
default = ["zip"]
[packages.oh-my-posh]
brew = ["oh-my-posh"]
[packages.cowsay]
default = ["cowsay"]
[packages.fortune]
apt = ["fortune-mod"]
dnf = ["fortune-mod"]
pacman = ["fortune-mod"]
brew = ["fortune"]
[packages.lolcat]
default = ["lolcat"]
[packages.python]
apt = ["python3", "python3-venv"]
dnf = ["python3"]
pacman = ["python"]
brew = ["python"]
[packages.uv]
brew = ["uv"]
[packages.fnm]
brew = ["fnm"]
[packages.rustup]
brew = ["rustup"]
[packages.cmake]
default = ["cmake"]
[packages.pkgconf]
apt = ["pkg-config"]
dnf = ["pkgconf-pkg-config"]
pacman = ["pkgconf"]
brew = ["pkgconf"]
[packages.ccache]
default = ["ccache"]

# Used only when explicitly bootstrapping Homebrew.
[packages.build-tools]
apt = ["build-essential"]
dnf = ["gcc", "gcc-c++", "make"]
pacman = ["base-devel"]
[packages.procps]
apt = ["procps"]
dnf = ["procps-ng"]
pacman = ["procps-ng"]
[packages.curl]
default = ["curl"]
[packages.file]
default = ["file"]
[packages.ca-certificates]
default = ["ca-certificates"]
